# Setup
title:               "Math Enthusiast"
description:         "Explore the ideas, problems, and discoveries that make modern mathematics fascinating."
url:                 https://nglelinh.github.io
baseurl:             '/math-enthusiast'
imgurl:              https://nglelinh.github.io/math-enthusiast/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Math Enthusiast"
    description: "Explore the ideas, problems, and discoveries that make modern mathematics fascinating."
    home: "Home"
    chapters: "Sections"
    language: "Language"
    switch_language: "Switch to Vietnamese"
  vi:
    title: "Toán Học Cho Người Yêu Toán"
    description: "Khám phá các ý tưởng, bài toán và phát kiến làm nên sức hấp dẫn của toán học hiện đại."
    home: "Trang chủ"
    chapters: "Các phần"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
# About/contact
author:
  name:              Nguyen Le Linh
  email:             your.email@example.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.1.0
markdown: kramdown

# Analytics
google_analytics_id: ""
