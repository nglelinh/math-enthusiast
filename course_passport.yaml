policies:
  grading_scheme: >-
    Final grade = weighted sum per assessment_plan (A1–A6). Reading responses (A2) use
    pass/revise against a posted spec (precise statement or claim; engagement with the
    flagship reading; one genuine question). Best 5 of 6 count. Letter cutoffs:
    [NEEDS PROFESSOR INPUT: institutional letter scale] — default suggestion A≥93, A- 90–92,
    B+ 87–89, B 83–86, B- 80–82, C+ 77–79, C 70–76, D 60–69, F<60, no curve unless department requires.
  late_policy: >-
    Papers and portfolio milestones (A3, A4, A5, A6): 3 free late days pooled across the
    term (max 2 on one artifact); then −1/3 letter grade per day up to 3 days, then not
    accepted without documented exception. Reading responses (A2): no late work — best-of-6
    absorbs misses. Participation (A1) cannot be made up by late submission.
  ai_use_policy: >-
    Tier P (live, unaided): A1 seminar participation and discussion leadership.
    Tier D (tools allowed with disclosure): A2 reading responses, A3 open-problem brief,
    A4 proof-idea narrative — short disclosure (tool, prompt intent, what you changed);
    non-disclosure when required is an integrity matter.
    Tier O (AI collaboration expected; graded on judgment beyond the tool): A6 synthesis
    essay — required process note on verification and what you added.
    A5 exploration portfolio: generative AI may help with coding/plotting if disclosed;
    the research log of your own experiments is the primary evidence and must be authentic.
    Full table to appear in syllabus.md.
  integrity_policy: "[NEEDS PROFESSOR INPUT: link to institutional academic integrity policy]"
  attendance_policy: >-
    Seminar depends on presence and preparation. More than two unexcused absences requires
    a meeting with the instructor. Discussion leadership (A1) requires attendance that week.
    Quality of engagement with readings and peers is assessed, not volume of talk.

