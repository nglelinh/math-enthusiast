# Course Passport — Math Enthusiast
# Schema: teaching-skills course_passport_schema.md (passport_version 1.0)
# Confirmed professor decisions (2026-08-03):
#   audience = undergraduate seminar
#   modality = taught course with deliverables
#   depth strategy = flagship-per-section first
#   proceed with passport + LOs

passport_version: "1.0"
course:
  code: "[NEEDS PROFESSOR INPUT: institutional course code]"
  title: "Math Enthusiast"
  discipline: "Mathematics"
  level: "undergraduate-seminar"
  credits: 3
  modality: "in-person"            # weekly seminar; materials bilingual EN/VI on course site
  class_size: 18                   # seminar cap; adjust to department policy
  contact_hours_per_week: 2.5      # one 150-minute weekly seminar (adjust if 2×75)
  weeks: 15
  language_of_instruction: "English"
  materials_languages: ["en", "vi"]
  prerequisites:
    - "One year of university calculus (or equivalent comfort with proofs at introductory level)"
    - "Willingness to read carefully; no prior harmonic analysis or algebraic geometry required"
  institution_constraints:
    - "Discussion- and writing-intensive seminar; flagship-depth readings rather than full textbook drills"
    - "Site content is a bilingual map; only flagship lessons are required deep reads each week"

term_calendar:
  start_date: null                 # [NEEDS PROFESSOR INPUT: term start ISO date]
  end_date: null
  holidays: []
  exam_weeks: [W15]                # no sit-down final; W15 is submission / synthesis week
  add_drop_deadline: "[NEEDS PROFESSOR INPUT: registrar add/drop deadline]"
  withdrawal_deadline: "[NEEDS PROFESSOR INPUT: registrar withdrawal deadline]"

learner_profile:
  prior_knowledge: >-
    Undergraduates (typically year 2–4) with calculus and some exposure to proofs
    (discrete math, linear algebra, or analysis-lite). Comfort with definitions varies.
    Not assumed: measure theory, algebraic geometry, or research-level number theory.
  motivation_context: >-
    Elective or seminar toward a math/CS/physics major or for students who want a
    map of modern mathematics beyond the standard computational syllabus. Curiosity-driven;
    some intend research exposure, others interdisciplinary literacy.
  known_difficulties:
    - "Confusing popular slogans with precise mathematical statements"
    - "Treating measure zero as 'dimension zero' (size notions)"
    - "Wanting a full technical proof when the learning goal is the idea of the proof"
    - "Passive reading without forming questions or conjectures"
    - "Uneven bilingual depth if only one language is updated"
  accessibility_needs: "unknown"
  cohort_evidence: null

learning_outcomes:
  - id: LO1
    statement: >-
      Explain a major open (or recently resolved) mathematical problem: state it precisely
      enough for a peer, identify why it is difficult, and name at least one mathematical
      tool or theory developed around it—without claiming a full solution.
    bloom_level: understand
    assessed_by: [A2, A3, A6]
    taught_in: [W1, W2, W3, W4, W5]
  - id: LO2
    statement: >-
      Distinguish and compare different notions of mathematical "size" (e.g. Lebesgue measure
      vs Hausdorff/Minkowski dimension, or analogous pairs) using Kakeya sets or another
      course example, and correct the misconception that measure zero implies lower dimension.
    bloom_level: analyze
    assessed_by: [A2, A3, A5]
    taught_in: [W4, W5, W11]
  - id: LO3
    statement: >-
      Reconstruct the core idea of a famous proof or breakthrough (logical skeleton and key
      insight) in a short narrative that a classmate could follow, distinguishing idea from
      technical detail.
    bloom_level: analyze
    assessed_by: [A2, A4, A6]
    taught_in: [W5, W8, W9]
  - id: LO4
    statement: >-
      Relate a classical mathematical field from the course map (e.g. number theory, linear
      algebra, probability, graph theory) to a named modern application or technology, with
      a correct one-step mechanism (not only a buzzword).
    bloom_level: apply
    assessed_by: [A2, A6]
    taught_in: [W6, W10]
  - id: LO5
    statement: >-
      Design and carry out a small mathematical exploration: formulate a question or conjecture,
      document experiments or examples, and report what was learned including failed attempts.
    bloom_level: create
    assessed_by: [A5]
    taught_in: [W11, W12, W13, W14]
  - id: LO6
    statement: >-
      Critique a popular or secondary exposition of a mathematical breakthrough for precision
      versus hype, citing at least one place where wording overstates or understates the theorem.
    bloom_level: evaluate
    assessed_by: [A1, A6]
    taught_in: [W1, W5, W10, W14]

assessment_plan:
  # Weights: 15 + 15 + 15 + 15 + 25 + 15 = 100
  - id: A1
    type: participation
    title: "Seminar participation & discussion leadership"
    weight: 15
    outcomes_assessed: [LO6, LO1]
    week: "W2–W14 (ongoing; each student co-leads or opens one discussion once)"
    ai_resilience: reviewed          # live seminar — Tier P by construction
    artifact_ref: "assignments/A1_participation.md"
  - id: A2
    type: homework
    title: "Reading responses (6 assigned; best 5 count)"
    weight: 15
    outcomes_assessed: [LO1, LO2, LO3, LO4]
    week: "W2 / W3 / W4 / W6 / W8 / W10 (best 5 of 6)"
    ai_resilience: reviewed          # Tier D: disclosure required; pass/revise specs
    artifact_ref: "assignments/A2_reading_responses.md"
  - id: A3
    type: paper
    title: "Open-problem brief (~1200–1500 words)"
    weight: 15
    outcomes_assessed: [LO1, LO2]
    week: W5
    ai_resilience: reviewed          # process note + source list; no pure chat dump
    artifact_ref: "assignments/A3_open_problem_brief.md"
  - id: A4
    type: paper
    title: "Proof-idea narrative (~1200–1500 words)"
    weight: 15
    outcomes_assessed: [LO3]
    week: W9
    ai_resilience: reviewed
    artifact_ref: "assignments/A4_proof_idea_narrative.md"
  - id: A5
    type: portfolio
    title: "Exploration portfolio (staged: proposal W11 · log W13 · report W15)"
    weight: 25
    outcomes_assessed: [LO5, LO2]
    week: "W11 / W13 / W15 (milestones)"
    ai_resilience: redesigned        # staged process evidence; log is primary evidence
    artifact_ref: "assignments/A5_exploration_portfolio.md"
  - id: A6
    type: paper
    title: "Synthesis essay: personal map of modern mathematics + critique (~1500–2000 words)"
    weight: 15
    outcomes_assessed: [LO1, LO3, LO4, LO6]
    week: W15
    ai_resilience: reviewed          # Tier O-friendly: judgment beyond tools; process note
    artifact_ref: "assignments/A6_synthesis_essay.md"

