<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">From nonlinear waves to a wave kinetic equation</text>
  <rect x="40" y="70" width="280" height="120" rx="8" fill="#e8f1fa" stroke="#004586" stroke-width="2"/>
  <text x="180" y="110" text-anchor="middle" font-family="system-ui" font-size="13" fill="#004586" font-weight="600">Many wave modes</text>
  <text x="180" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">nonlinear dispersive PDE</text>
  <text x="180" y="165" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">(e.g. cubic NLS regime)</text>
  <path d="M340 130 L400 130" stroke="#333" stroke-width="2"/>
  <polygon points="400,125 415,130 400,135" fill="#333"/>
  <rect x="420" y="70" width="260" height="120" rx="8" fill="#fff3e8" stroke="#c73e1d" stroke-width="2"/>
  <text x="550" y="110" text-anchor="middle" font-family="system-ui" font-size="13" fill="#c73e1d" font-weight="600">Wave kinetic equation</text>
  <text x="550" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">energy spectrum evolution</text>
  <text x="550" y="165" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">statistical transport in k-space</text>
  <text x="360" y="230" text-anchor="middle" font-family="system-ui" font-size="13" fill="#444">Physics used wave turbulence for decades; Deng–Hani give rigorous emergence on kinetic time scales in precise limits.</text>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui" font-size="11" fill="#888">Not a full ocean internal-wave model—a mathematical foundation for “how statistics arise from many waves.”</text>
</svg>