<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160">
  <rect width="560" height="160" fill="#fafbfc"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="15" fill="#222">Arithmetic progression of primes (length 5)</text>
  <g font-family="sans-serif" font-size="14">
    <circle cx="70" cy="90" r="28" fill="#e8f1fb" stroke="#004586" stroke-width="2"/><text x="70" y="95" text-anchor="middle" fill="#004586">5</text>
    <circle cx="160" cy="90" r="28" fill="#e8f1fb" stroke="#004586" stroke-width="2"/><text x="160" y="95" text-anchor="middle" fill="#004586">11</text>
    <circle cx="250" cy="90" r="28" fill="#e8f1fb" stroke="#004586" stroke-width="2"/><text x="250" y="95" text-anchor="middle" fill="#004586">17</text>
    <circle cx="340" cy="90" r="28" fill="#e8f1fb" stroke="#004586" stroke-width="2"/><text x="340" y="95" text-anchor="middle" fill="#004586">23</text>
    <circle cx="430" cy="90" r="28" fill="#e8f1fb" stroke="#004586" stroke-width="2"/><text x="430" y="95" text-anchor="middle" fill="#004586">29</text>
  </g>
  <text x="16" y="145" font-family="sans-serif" font-size="12" fill="#444">common difference d = 6 ··· p, p+d, …, p+(k−1)d all prime</text>
</svg>
