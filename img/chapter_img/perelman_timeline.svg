<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <rect width="640" height="160" fill="#fafbfc"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="15" fill="#222">Selected milestones</text>
  <line x1="40" y1="90" x2="600" y2="90" stroke="#004586" stroke-width="3"/>
  <g font-family="sans-serif" font-size="11" fill="#222">
    <circle cx="70" cy="90" r="6" fill="#004586"/><text x="70" y="70" text-anchor="middle">1904</text><text x="70" y="120" text-anchor="middle">Poincaré</text>
    <circle cx="200" cy="90" r="6" fill="#004586"/><text x="200" y="70" text-anchor="middle">1982–</text><text x="200" y="120" text-anchor="middle">Hamilton</text>
    <circle cx="330" cy="90" r="6" fill="#004586"/><text x="330" y="70" text-anchor="middle">1982</text><text x="330" y="120" text-anchor="middle">Thurston</text>
    <circle cx="460" cy="90" r="6" fill="#a11"/><text x="460" y="70" text-anchor="middle">2002–03</text><text x="460" y="120" text-anchor="middle">Perelman</text>
    <circle cx="580" cy="90" r="6" fill="#1e7e34"/><text x="580" y="70" text-anchor="middle">2006</text><text x="580" y="120" text-anchor="middle">Fields*</text>
  </g>
  <text x="20" y="150" font-size="11" fill="#666">*Perelman declined the Fields Medal (and later the Clay Millennium Prize).</text>
</svg>
