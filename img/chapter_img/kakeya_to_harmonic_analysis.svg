<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <rect width="520" height="520" fill="#fafbfc"/>
  <text x="260" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">From Kakeya geometry to analysis</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#004586"/>
    </marker>
  </defs>
  <g font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">
    <rect x="160" y="50" width="200" height="40" rx="6" fill="#e8f1fa" stroke="#004586"/>
    <text x="260" y="75" fill="#004586" font-weight="600">Kakeya / tubes</text>
    <line x1="260" y1="90" x2="260" y2="115" stroke="#004586" stroke-width="2" marker-end="url(#a)"/>
    <rect x="140" y="120" width="240" height="40" rx="6" fill="#e8f1fa" stroke="#004586"/>
    <text x="260" y="145" fill="#333">Geometric measure theory</text>
    <line x1="260" y1="160" x2="260" y2="185" stroke="#004586" stroke-width="2" marker-end="url(#a)"/>
    <rect x="140" y="190" width="240" height="40" rx="6" fill="#e8f1fa" stroke="#004586"/>
    <text x="260" y="215" fill="#333">Tube intersections / multi-scale</text>
    <line x1="260" y1="230" x2="260" y2="255" stroke="#004586" stroke-width="2" marker-end="url(#a)"/>
    <rect x="140" y="260" width="240" height="40" rx="6" fill="#e8f1fa" stroke="#004586"/>
    <text x="260" y="285" fill="#333">Wave packets / Fourier</text>
    <line x1="260" y1="300" x2="260" y2="325" stroke="#004586" stroke-width="2" marker-end="url(#a)"/>
    <rect x="100" y="330" width="320" height="50" rx="6" fill="#fff3e8" stroke="#c73e1d"/>
    <text x="260" y="352" fill="#c73e1d" font-weight="600">Restriction · oscillatory integrals</text>
    <text x="260" y="370" fill="#c73e1d">local smoothing · PDE</text>
  </g>
  <text x="260" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#555">Each wave packet lives roughly on a long thin tube;</text>
  <text x="260" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#555">how tubes can cluster controls how energy can concentrate.</text>
  <text x="260" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#888">Schematic conceptual map (not a theorem dependency graph).</text>
</svg>