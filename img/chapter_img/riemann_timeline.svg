<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
  <rect width="800" height="260" fill="#fafbfc"/>
  <text x="400" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Riemann Hypothesis — selected milestones</text>
  <line x1="40" y1="130" x2="760" y2="130" stroke="#004586" stroke-width="3"/>
  <g font-family="system-ui" font-size="11" text-anchor="middle" fill="#333">
    <circle cx="80" cy="130" r="7" fill="#004586"/>
    <text x="80" y="95" font-weight="600">1859</text>
    <text x="80" y="165">Riemann</text>
    <text x="80" y="182">memoir on π(x)</text>
    <circle cx="220" cy="130" r="7" fill="#004586"/>
    <text x="220" y="95" font-weight="600">1896</text>
    <text x="220" y="165">Hadamard,</text>
    <text x="220" y="182">de la Vallée Poussin</text>
    <text x="220" y="199">Prime Number Theorem</text>
    <circle cx="380" cy="130" r="7" fill="#004586"/>
    <text x="380" y="95" font-weight="600">20th c.</text>
    <text x="380" y="165">zero-free regions,</text>
    <text x="380" y="182">density theorems,</text>
    <text x="380" y="199">numerical zeros</text>
    <circle cx="540" cy="130" r="7" fill="#004586"/>
    <text x="540" y="95" font-weight="600">1974–</text>
    <text x="540" y="165">Deligne et al.</text>
    <text x="540" y="182">function-field</text>
    <text x="540" y="199">analogues</text>
    <circle cx="680" cy="130" r="7" fill="#c73e1d"/>
    <text x="680" y="95" font-weight="600" fill="#c73e1d">open</text>
    <text x="680" y="165">RH for ζ(s)</text>
    <text x="680" y="182">still unproved</text>
    <text x="680" y="199">over ℚ</text>
  </g>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">Millennium Prize Problem (CMI). Billions of zeros checked on the critical line — not a proof.</text>
</svg>