  </defs>
  <g font-family="system-ui" font-size="13" text-anchor="middle">
    <rect x="200" y="50" width="320" height="40" rx="6" fill="#e8f1fa" stroke="#004586"/>
    <text x="360" y="75" fill="#004586">Data as vectors / tensors</text>
    <line x1="360" y1="90" x2="360" y2="110" stroke="#004586" marker-end="url(#ar)"/>
    <rect x="200" y="115" width="320" height="40" rx="6" fill="#e8f1fa" stroke="#004586"/>
    <text x="360" y="140" fill="#333">Linear maps + nonlinearities</text>
