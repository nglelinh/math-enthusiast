<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <rect width="720" height="340" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Collatz rule (one step)</text>
  <rect x="260" y="60" width="200" height="50" rx="8" fill="#e8f1fa" stroke="#004586" stroke-width="2"/>
  <text x="360" y="92" text-anchor="middle" font-family="system-ui" font-size="16" fill="#004586">n</text>
  <path d="M300 110 L220 160" stroke="#004586" stroke-width="2"/>
  <path d="M420 110 L500 160" stroke="#c73e1d" stroke-width="2"/>
  <text x="230" y="145" font-family="system-ui" font-size="12" fill="#004586">even: n/2</text>
  <text x="480" y="145" font-family="system-ui" font-size="12" fill="#c73e1d">odd: 3n+1</text>
  <rect x="140" y="170" width="160" height="45" rx="6" fill="#fff" stroke="#004586"/>
  <text x="220" y="198" text-anchor="middle" font-family="system-ui" font-size="14" fill="#333">n/2</text>
  <rect x="420" y="170" width="160" height="45" rx="6" fill="#fff" stroke="#c73e1d"/>
  <text x="500" y="198" text-anchor="middle" font-family="system-ui" font-size="14" fill="#333">3n+1</text>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">Conjecture: every positive integer eventually reaches the cycle 4 → 2 → 1.</text>
  <text x="360" y="290" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">Exploration studio: experiment, record stopping times, form conjectures — not prove RH-level theorems.</text>
  <text x="360" y="320" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">Example orbit: 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1</text>
</svg>