<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Two kinds of zeros of ζ(s)</text>
  <rect x="50" y="60" width="280" height="180" rx="8" fill="#fff" stroke="#888" stroke-width="2"/>
  <text x="190" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#555">Trivial zeros</text>
  <text x="190" y="130" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">s = −2, −4, −6, …</text>
  <text x="190" y="160" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">negative even integers</text>
  <text x="190" y="195" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">understood via the</text>
  <text x="190" y="212" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">functional equation</text>
  <rect x="390" y="60" width="280" height="180" rx="8" fill="#fff" stroke="#c73e1d" stroke-width="2"/>
  <text x="530" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c73e1d">Non-trivial zeros</text>
  <text x="530" y="130" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">inside the critical strip</text>
  <text x="530" y="160" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">0 &lt; Re(s) &lt; 1</text>
  <text x="530" y="195" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">RH: all have</text>
  <text x="530" y="212" text-anchor="middle" font-family="system-ui" font-size="12" fill="#c73e1d" font-weight="600">Re(s) = 1/2</text>
</svg>