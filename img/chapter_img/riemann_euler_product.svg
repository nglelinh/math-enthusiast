<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#fafbfc"/>
  <text x="360" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1a1a1a">Euler product: zeta “hears” the primes</text>
  <rect x="40" y="70" width="280" height="140" rx="8" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="180" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#004586">Dirichlet series</text>
  <text x="180" y="150" text-anchor="middle" font-family="system-ui" font-size="16" fill="#1a1a1a">ζ(s) = Σ n⁻ˢ</text>
  <text x="180" y="185" text-anchor="middle" font-family="system-ui" font-size="12" fill="#555">all positive integers</text>
  <text x="360" y="145" text-anchor="middle" font-family="system-ui" font-size="22" fill="#333">=</text>
  <rect x="400" y="70" width="280" height="140" rx="8" fill="#fff" stroke="#0a6b4a" stroke-width="2"/>
  <text x="540" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#0a6b4a">Euler product</text>
  <text x="540" y="150" text-anchor="middle" font-family="system-ui" font-size="15" fill="#1a1a1a">Π (1 − p⁻ˢ)⁻¹</text>
  <text x="540" y="185" text-anchor="middle" font-family="system-ui" font-size="12" fill="#555">product over primes p</text>
  <text x="360" y="250" text-anchor="middle" font-family="system-ui" font-size="13" fill="#444">For Re(s) &gt; 1 the two expressions agree — primes completely determine ζ in that half-plane.</text>
</svg>