<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <rect width="720" height="320" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Sizes of infinity (schematic)</text>
  <rect x="80" y="80" width="160" height="160" rx="8" fill="#e8f1fa" stroke="#004586" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-family="system-ui" font-size="14" fill="#004586">|ℕ| = ℵ₀</text>
  <text x="160" y="180" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">countable</text>
  <text x="160" y="205" text-anchor="middle" font-family="system-ui" font-size="11" fill="#666">ℤ, ℚ same size</text>
  <text x="280" y="160" font-size="28" fill="#333">&lt;</text>
  <rect x="320" y="60" width="200" height="200" rx="8" fill="#fff3e8" stroke="#c73e1d" stroke-width="2"/>
  <text x="420" y="150" text-anchor="middle" font-family="system-ui" font-size="14" fill="#c73e1d">|ℝ| = 𝔠</text>
  <text x="420" y="180" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">continuum</text>
  <text x="420" y="205" text-anchor="middle" font-family="system-ui" font-size="11" fill="#666">uncountable</text>
  <text x="360" y="290" text-anchor="middle" font-family="system-ui" font-size="12" fill="#444">Diagonal argument: no listing of reals can be complete. Continuum hypothesis: is anything strictly between?</text>
</svg>