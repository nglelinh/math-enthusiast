<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280">
  <rect width="420" height="280" fill="#fafbfc"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="15" fill="#222">Four mutually adjacent regions (needs 4 colors)</text>
  <!-- three outer + one central -->
  <path d="M210 50 L320 140 L210 230 L100 140 Z" fill="#e8f1fb" stroke="#004586" stroke-width="2"/>
  <path d="M210 50 L320 140 L380 60 Z" fill="#fde8e8" stroke="#a11" stroke-width="2"/>
  <path d="M320 140 L210 230 L380 220 Z" fill="#e6f6ea" stroke="#1e7e34" stroke-width="2"/>
  <path d="M210 230 L100 140 L40 220 Z" fill="#fff5e6" stroke="#b35c00" stroke-width="2"/>
  <path d="M100 140 L210 50 L40 60 Z" fill="#f3e8fb" stroke="#6b2d8b" stroke-width="2"/>
  <text x="210" y="145" text-anchor="middle" font-size="12" fill="#004586">A</text>
  <text x="300" y="90" text-anchor="middle" font-size="12" fill="#a11">B</text>
  <text x="300" y="200" text-anchor="middle" font-size="12" fill="#1e7e34">C</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#b35c00">D</text>
  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#6b2d8b">…</text>
  <text x="16" y="265" font-size="11" fill="#666">Schematic: each pair of outer “countries” may share a border with center and neighbors.</text>
</svg>
