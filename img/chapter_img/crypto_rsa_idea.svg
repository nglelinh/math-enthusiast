<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Public-key idea (RSA-style, schematic)</text>
  <rect x="40" y="70" width="180" height="100" rx="8" fill="#fff" stroke="#004586" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-family="system-ui" font-size="13" fill="#004586">Public: n, e</text>
  <text x="130" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">anyone encrypts</text>
  <path d="M230 120 L300 120" stroke="#333" stroke-width="2"/>
  <polygon points="300,115 315,120 300,125" fill="#333"/>
  <rect x="320" y="70" width="180" height="100" rx="8" fill="#fff" stroke="#0a6b4a" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" font-family="system-ui" font-size="13" fill="#0a6b4a">Ciphertext</text>
  <text x="410" y="140" text-anchor="middle" font-family="system-ui" font-size="12" fill="#333">c ≡ mᵉ (mod n)</text>
  <path d="M510 120 L580 120" stroke="#333" stroke-width="2"/>
  <polygon points="580,115 595,120 580,125" fill="#333"/>
  <rect x="600" y="70" width="100" height="100" rx="8" fill="#fff" stroke="#c73e1d" stroke-width="2"/>
  <text x="650" y="110" text-anchor="middle" font-family="system-ui" font-size="12" fill="#c73e1d">Private d</text>
  <text x="650" y="140" text-anchor="middle" font-family="system-ui" font-size="11" fill="#333">decrypt</text>
  <text x="360" y="220" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">Hardness (informally): factoring n = pq should be hard → recovering d from public data is hard.</text>
  <text x="360" y="250" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">Pedagogical cartoon — real RSA needs padding, careful parameters, and precise complexity assumptions.</text>
</svg>