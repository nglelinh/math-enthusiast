<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <rect width="800" height="280" fill="#fafbfc"/>
  <text x="400" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1a1a1a">Kakeya story (selected milestones)</text>
  <line x1="50" y1="140" x2="750" y2="140" stroke="#004586" stroke-width="3"/>
  <!-- ticks -->
  <g font-family="system-ui,sans-serif" font-size="11" fill="#333" text-anchor="middle">
    <circle cx="90" cy="140" r="7" fill="#004586"/>
    <text x="90" y="100" font-weight="600">1917</text>
    <text x="90" y="175">Kakeya</text>
    <text x="90" y="192">needle problem</text>
    <circle cx="220" cy="140" r="7" fill="#004586"/>
    <text x="220" y="100" font-weight="600">~1919–28</text>
    <text x="220" y="175">Besicovitch</text>
    <text x="220" y="192">measure 0 sets</text>
    <circle cx="360" cy="140" r="7" fill="#004586"/>
    <text x="360" y="100" font-weight="600">1971</text>
    <text x="360" y="175">Davies</text>
    <text x="360" y="192">dim = 2 in ℝ²</text>
    <circle cx="500" cy="140" r="7" fill="#004586"/>
    <text x="500" y="100" font-weight="600">1970s–20s</text>
    <text x="500" y="175">Wolff, Bourgain,</text>
    <text x="500" y="192">Katz, Tao, Guth…</text>
    <circle cx="650" cy="140" r="7" fill="#c73e1d"/>
    <text x="650" y="100" font-weight="600" fill="#c73e1d">2025</text>
    <text x="650" y="175">Wang–Zahl</text>
    <text x="650" y="192">dim = 3 in ℝ³</text>
    <circle cx="740" cy="140" r="7" fill="#0a6b4a"/>
    <text x="740" y="100" font-weight="600" fill="#0a6b4a">2026</text>
    <text x="740" y="175">Wang</text>
    <text x="740" y="192">Fields Medal</text>
  </g>
  <text x="400" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">Higher dimensions n ≥ 4 remain open for the full Kakeya set conjecture.</text>
</svg>