<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220">
  <rect width="560" height="220" fill="#fafbfc"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="15" fill="#222">Ricci flow as geometric heat equation (schematic)</text>
  <!-- bumpy oval -->
  <path d="M60 120 C80 60, 140 50, 180 90 C210 120, 200 170, 150 180 C100 190, 50 160, 60 120 Z" fill="#fde8e8" stroke="#a11" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-size="12" fill="#a11">irregular metric</text>
  <text x="120" y="205" text-anchor="middle" font-size="12" fill="#444">t = 0</text>
  <path d="M230 120 L280 120" stroke="#666" stroke-width="2"/>
  <text x="255" y="105" text-anchor="middle" font-size="12" fill="#004586">∂ₜg = −2 Ric</text>
  <!-- rounder -->
  <ellipse cx="380" cy="120" rx="70" ry="55" fill="#e8f1fb" stroke="#004586" stroke-width="2"/>
  <text x="380" y="125" text-anchor="middle" font-size="12" fill="#004586">more uniform</text>
  <text x="380" y="205" text-anchor="middle" font-size="12" fill="#444">t &gt; 0 (if no singularity)</text>
  <circle cx="500" cy="120" r="48" fill="#e6f6ea" stroke="#1e7e34" stroke-width="2"/>
  <text x="500" y="125" text-anchor="middle" font-size="11" fill="#1e7e34">model geometry</text>
</svg>
