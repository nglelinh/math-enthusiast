    <path d="M360 100 L280 140"/>
    <path d="M360 100 L440 140"/>
    <path d="M280 140 L240 190"/>
    <path d="M280 140 L320 190"/>
    <path d="M440 140 L400 190"/>
    <path d="M440 140 L500 190"/>
    <path d="M240 190 L220 240"/>
    <path d="M240 190 L270 240"/>
    <path d="M500 190 L480 240"/>
    <path d="M500 190 L540 240"/>
