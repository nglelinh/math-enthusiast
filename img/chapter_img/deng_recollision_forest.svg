  <text x="360" y="280" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">Collision histories branch; particles can meet “old acquaintances” again.</text>
  <text x="360" y="305" text-anchor="middle" font-family="system-ui" font-size="12" fill="#666">Molecular chaos assumes weak pre-collisional correlation—hard to keep over long times. Deng–Hani–Ma cut large combinatorial structures into controllable pieces.</text>
