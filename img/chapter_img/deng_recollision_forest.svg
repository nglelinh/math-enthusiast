  <rect width="720" height="320" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Recollision “forest” (combinatorial histories)</text>
  <!-- simple tree -->
  <g stroke="#004586" stroke-width="2" fill="none">
