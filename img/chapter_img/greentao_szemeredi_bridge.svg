<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180">
  <rect width="560" height="180" fill="#fafbfc"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="15" fill="#222">From Szemerédi to primes</text>
  <rect x="20" y="55" width="140" height="70" rx="8" fill="#fff5e6" stroke="#b35c00" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" font-size="12" fill="#b35c00">Szemerédi</text>
  <text x="90" y="105" text-anchor="middle" font-size="11" fill="#666">positive density</text>
  <path d="M170 90 L210 90" stroke="#666" stroke-width="2"/>
  <rect x="220" y="55" width="140" height="70" rx="8" fill="#e8f1fb" stroke="#004586" stroke-width="2"/>
  <text x="290" y="85" text-anchor="middle" font-size="12" fill="#004586">transference</text>
  <text x="290" y="105" text-anchor="middle" font-size="11" fill="#666">+ pseudorandom ν</text>
  <path d="M370 90 L410 90" stroke="#666" stroke-width="2"/>
  <rect x="420" y="55" width="120" height="70" rx="8" fill="#e6f6ea" stroke="#1e7e34" stroke-width="2"/>
  <text x="480" y="85" text-anchor="middle" font-size="12" fill="#1e7e34">Green–Tao</text>
  <text x="480" y="105" text-anchor="middle" font-size="11" fill="#666">primes have APs</text>
  <text x="16" y="160" font-size="12" fill="#444">Zero density is the obstacle; relative structure is the bridge.</text>
</svg>
