<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <rect width="520" height="240" fill="#fafbfc"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="16" fill="#222">Simply connected 3-manifold?</text>
  <circle cx="140" cy="130" r="70" fill="#e8f1fb" stroke="#004586" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#004586">S³</text>
  <text x="140" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">model: 3-sphere</text>
  <path d="M250 130 L300 130" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666"/></marker></defs>
  <ellipse cx="400" cy="130" rx="85" ry="55" fill="#fff5e6" stroke="#b35c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="400" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#b35c00">M³</text>
  <text x="400" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">π₁(M)=0 ?</text>
  <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">homeomorphic to S³?</text>
</svg>
