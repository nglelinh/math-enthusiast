<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <rect width="720" height="360" fill="#fafbfc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Prime counting: main term vs error (cartoon)</text>
  <!-- axes -->
  <line x1="60" y1="300" x2="680" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="60" y2="300" stroke="#333" stroke-width="1.5"/>
  <text x="680" y="320" font-family="system-ui" font-size="12" fill="#333">x</text>
  <text x="40" y="55" font-family="system-ui" font-size="12" fill="#333">count</text>
  <!-- li(x) smooth -->
  <path d="M60,280 Q200,220 340,160 T680,80" fill="none" stroke="#004586" stroke-width="2.5"/>
  <text x="500" y="90" font-family="system-ui" font-size="12" fill="#004586">li(x) ~ main term</text>
  <!-- pi(x) steppy -->
  <path d="M60,285 L100,285 L100,275 L150,275 L150,255 L200,255 L200,245 L280,245 L280,220 L360,220 L360,200 L450,200 L450,175 L550,175 L550,150 L650,150 L650,130" fill="none" stroke="#c73e1d" stroke-width="2"/>
  <text x="560" y="145" font-family="system-ui" font-size="12" fill="#c73e1d">π(x) primes ≤ x</text>
  <!-- error band -->
  <path d="M60,275 Q200,210 340,150 T680,70" fill="none" stroke="#0a6b4a" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <path d="M60,290 Q200,230 340,170 T680,90" fill="none" stroke="#0a6b4a" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0a6b4a">RH controls how tightly π(x) hugs the main term</text>
  <text x="360" y="355" text-anchor="middle" font-family="system-ui" font-size="11" fill="#888">Not a plot of real data — pedagogical sketch only.</text>
</svg>