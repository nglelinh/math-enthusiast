<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#fafbfc"/>
  <text x="360" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1a1a1a">Venetian-blind rearrangement (schematic)</text>
  <!-- parallel strips -->
  <g stroke="#004586" stroke-width="8" stroke-linecap="butt" opacity="0.85">
    <line x1="60" y1="70" x2="300" y2="70"/>
    <line x1="60" y1="100" x2="300" y2="100"/>
    <line x1="60" y1="130" x2="300" y2="130"/>
    <line x1="60" y1="160" x2="300" y2="160"/>
    <line x1="60" y1="190" x2="300" y2="190"/>
  </g>
  <text x="180" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#333">Nearly parallel thin strips</text>
  <path d="M320 130 L380 130" stroke="#333" stroke-width="2"/>
  <polygon points="380,125 395,130 380,135" fill="#333"/>
  <!-- tilted -->
  <g stroke="#0a6b4a" stroke-width="8" opacity="0.85">
    <line x1="420" y1="55" x2="660" y2="95"/>
    <line x1="420" y1="90" x2="660" y2="130"/>
    <line x1="420" y1="125" x2="660" y2="165"/>
    <line x1="420" y1="160" x2="660" y2="200"/>
    <line x1="420" y1="195" x2="660" y2="235"/>
  </g>
  <text x="540" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#333">Tilt, cut into pieces, re-stack with shifts</text>
  <text x="360" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#444">Iterate: keep directional information, reduce total area occupied.</text>
  <text x="360" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">After infinitely many stages → a measure-zero set with a unit segment in every direction.</text>
  <text x="360" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#888">Figure: schematic only (not a literal construction).</text>
</svg>